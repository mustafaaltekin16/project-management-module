<div class="toast-stack" role="status" aria-live="polite">
  @for (message of toastService.messages(); track message.id) {
    <div
      class="toast-item"
      [class.toast-item--error]="message.type === 'error'"
      [class.toast-item--warning]="message.type === 'warning'"
    >
      <span>{{ message.text }}</span>
      <button type="button" aria-label="Bildirimi kapat" (click)="toastService.dismiss(message.id)">×</button>
    </div>
  }
</div>
